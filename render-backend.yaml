# Render Blueprint for Linera Mine Backend
# Deploy with: https://render.com/deploy

services:
  # Backend API - Node.js with JSON file storage
  - type: web
    name: linera-mine-backend
    runtime: docker
    dockerfilePath: ./backend/Dockerfile.simple
    dockerContext: ./backend
    plan: starter  # $7/month - sufficient for backend API
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3001
      - key: DATA_DIR
        value: /data
    disk:
      name: linera-data
      mountPath: /data
      sizeGB: 1  # 1GB is plenty for JSON files
